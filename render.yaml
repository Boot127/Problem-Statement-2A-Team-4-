services:
  - type: web
    name: hrckmp-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      # PORT is deliberately not set here. Render injects it and detects the
      # port the service binds; pinning our own value risks binding somewhere
      # Render is not watching, which surfaces as a failed health check
      # rather than an obvious error. src/index.js already reads process.env.PORT.
      - key: DB_PROVIDER
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: PERMIT_AI_PROVIDER
        value: mock
      - key: ENABLE_DEV_SEED
        value: false
